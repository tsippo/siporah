name: Checks

on:
  pull_request:
  push:
    branches: [main]

# least privilege: this workflow only reads the code
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # exact versions from package-lock.json; no install scripts from packages
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in the packages the site ships
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # PageProps/LayoutProps route types are generated by Next.js
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
